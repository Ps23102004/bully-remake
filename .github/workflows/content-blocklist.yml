name: Content blocklist

on:
  push:
  pull_request:

jobs:
  blocklist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No imported game content may be committed
        run: |
          set -e
          FAIL=0
          # 1. The imported-content directory must never exist in the tree.
          if git ls-files | grep -iE '^(imported|Imported)/' ; then
            echo "::error::Files under imported/ are committed. Game content never enters this repo."
            FAIL=1
          fi
          # 2. No Bully/Rockstar container or asset formats anywhere in the tree.
          #    These are the game's own file types; original code has no reason to commit them.
          if git ls-files | grep -iE '\.(img|cat|nif|nft|kfm|kf|dir|wad|bin\.pak|mact)$' ; then
            echo "::error::Game-format files (IMG/CAT/NIF/...) are committed."
            FAIL=1
          fi
          # 3. No large binaries sneaking in (importers produce them; the repo holds code).
          for f in $(git ls-files); do
            if [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 10485760 ]; then
              echo "::error::$f is larger than 10 MB. This repo holds code, not content."
              FAIL=1
            fi
          done
          exit $FAIL
